<!--
  ASSINATURA DE E-MAIL - TIME FORTE MARKETING ESPORTIVO
  Rafael Serra, CEO  |  contatos como imagem + mapa de cliques

  Por que os contatos viraram imagem: era o unico texto HTML da assinatura,
  e texto reflui/encolhe em tela estreita - no celular ficava minusculo e o
  dark mode clareava o fundo. Como imagem, fica identico em todo lugar e
  imune ao dark mode. O <map> devolve os cliques:
    telefone -> WhatsApp | e-mail -> mailto | endereco -> Maps | resto -> site
  (No computador o mapa clica tudo; alguns apps de celular ignoram <map> -
   nesses, os contatos ficam legiveis para copiar. Card, faixa e barra
   permanecem imagens/GIF exatamente como antes.)

  Pecas no GitHub Pages (paulocesar0405/repo-assinaturas):
    card, contatos, faixa (GIF animado) e barra.

  ATENCAO ao duplicar este arquivo para outra pessoa - troque TAMBEM:
    - o name/id do <map> e o usemap (usam o slug: contatos-<slug>).
      Se duas assinaturas diferentes aparecerem no mesmo e-mail (thread
      com resposta citada), um <map> de nome repetido faz a imagem da 2a
      pessoa usar as areas da 1a - clica no e-mail de um, abre o de outro.
    - as coords do <map>, que sao proprias de cada pessoa (dependem da
      largura do telefone/e-mail renderizados).

  COORDS: as coords abaixo correspondem ao PNG que esta publicado em v1/.
  Conferidas por sobreposicao sobre a imagem real. NAO as substitua pelo
  que gerar_contatos.py imprime hoje sem antes regerar o PNG: as metricas
  de fonte mudam entre versoes do Pillow/FreeType, e o gerador atual imprime
  valores ~4px diferentes dos que valem para a imagem publicada.
-->
