<!--
  ASSINATURA DE E-MAIL - TIME FORTE MARKETING ESPORTIVO
  Rafael Serra, CEO  |  contatos como imagem fatiada, cada fatia com seu link

  Por que os contatos sao imagem: era o unico texto HTML da assinatura, e
  texto reflui/encolhe em tela estreita - no celular ficava minusculo e o
  dark mode clareava o fundo (a "faixa branca"). Como imagem, fica identico
  em todo lugar e imune ao dark mode.

  Por que FATIAS e nao <map>: a versao anterior era uma imagem unica com
  <map>/<area>. Isso funciona ao abrir este arquivo no navegador, mas NAO
  sobrevive a instalacao - o fluxo e Ctrl+A/Ctrl+C na pagina renderizada e
  colar no editor de assinatura do Gmail, e o <map> se perde no caminho: a
  <img> chega com um usemap apontando para um mapa que nao existe mais e
  nada fica clicavel. Era exatamente o sintoma relatado (telefone nao abria
  o WhatsApp, e-mail nao abria o compositor, endereco nao abria o Maps).
  Fatia + <a> em volta e o mesmo mecanismo do card e da barra, que sempre
  funcionaram: sobrevive ao copiar-colar, ao Gmail, ao Outlook E ao celular.

  Cliques:
    linha 1 esquerda (telefone) -> WhatsApp
    linha 1 direita  (e-mail)   -> mailto
    linha 2          (endereco) -> Google Maps
    card / faixa de marcas / barra -> site

  As fatias sao geradas por ferramentas/gerar_contatos.py, que corta no
  vazio preto entre o telefone e o bullet e entre as duas linhas - nenhuma
  letra e cortada. As larguras abaixo (375+225=600) e as alturas (26+23=49)
  sao as que o gerador imprime; ao clonar para outra pessoa, use as DELA.
-->
